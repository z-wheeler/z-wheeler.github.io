<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Player</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ---------------------------------------------
           Main page container
        --------------------------------------------- */

        #page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
        }


        /* ---------------------------------------------
           Current / top video
        --------------------------------------------- */

        #currentVideoContainer {
            width: 100%;
        }

        #currentPlayer {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border: none;
            background: black;
        }


        /* ---------------------------------------------
           Controls
        --------------------------------------------- */

        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            padding: 12px 0;
        }

        .controlButton {
            border: none;
            border-radius: 6px;

            background: #272727;
            color: white;

            font-size: 18px;

            min-width: 70px;
            height: 44px;

            cursor: pointer;
        }

        .controlButton:hover {
            background: #3a3a3a;
        }

        .controlButton:active {
            background: #4a4a4a;
        }

        .controlButton:disabled {
            opacity: 0.35;
            cursor: default;
        }

        
        /* ---------------------------------------------
           Search Return Button
        --------------------------------------------- */

        #returnSearchButton {
            display: block;

            width: 100%;
            margin: 5px 0 15px 0;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #272727;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #returnSearchButton:hover {
            background: #3a3a3a;
        }

        #returnSearchButton:active {
            background: #4a4a4a;
        }

        
        /* ---------------------------------------------
           Current video information
        --------------------------------------------- */

        #currentInfo {
            padding: 4px 0 15px 0;
        }

        #currentTitle {
            font-size: 18px;
            font-weight: bold;
        }

        #currentCounter {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }


        /* ---------------------------------------------
           Divider
        --------------------------------------------- */

        #divider {
            height: 1px;
            background: #333;
            margin-bottom: 15px;
        }


        /* ---------------------------------------------
           Lower video list
        --------------------------------------------- */

        #videoList {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* ---------------------------------------------
           Individual lower video
        --------------------------------------------- */

        .videoCard {
            width: 100%;
            cursor: pointer;
        }

        .videoCard iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border: none;
            background: black;
        }

        .videoCardLabel {
            padding-top: 7px;
            color: #ddd;
            font-size: 14px;
        }


        /* ---------------------------------------------
           Empty / error messages
        --------------------------------------------- */

        #message {
            padding: 30px 10px;
            text-align: center;
            color: #aaa;
        }


        /* ---------------------------------------------
           Debug information
        --------------------------------------------- */

        #debug {
            margin-top: 30px;
            padding: 12px;

            background: #181818;
            border: 1px solid #333;

            color: #888;

            font-family: monospace;
            font-size: 12px;

            white-space: pre-wrap;
            word-break: break-all;
        }

    </style>

</head>


<body>

<div id="page">


    <!-- =============================================
         CURRENT VIDEO
    ============================================== -->

    <div id="currentVideoContainer">

        <iframe
            id="currentPlayer"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


    <!-- =============================================
         CONTROLS
    ============================================== -->

    <div id="controls">

        <button
            id="backButton"
            class="controlButton">
            ◀
        </button>

        <button
            id="playPauseButton"
            class="controlButton">
            ▶
        </button>

        <button
            id="forwardButton"
            class="controlButton">
            ▶
        </button>

    </div>


    <!-- =============================================
         RETURN TO YOUTUBE SEARCH
    ============================================== -->

    <button
        id="returnSearchButton"
        style="display: none;">
        ↩ Go back to search results
    </button>

    
    <!-- =============================================
         CURRENT VIDEO INFORMATION
    ============================================== -->

    <div id="currentInfo">

        <div id="currentTitle">
            Video
        </div>

        <div id="currentCounter">
            1 / 1
        </div>

    </div>


    <div id="divider"></div>


    <!-- =============================================
         LOWER VIDEO LIST
    ============================================== -->

    <div id="videoList"></div>


    <!-- =============================================
         ERROR / STATUS MESSAGE
    ============================================== -->

    <div id="message"></div>


    <!-- =============================================
         DEBUG INFORMATION
    ============================================== -->

    <div id="debug"></div>


</div>


<script>

    // =================================================
    // READ VIDEO IDS FROM URL
    //
    // Example:
    //
    // ?videos=dQw4w9WgXcQ,abc12345678,xyz98765432
    // =================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const videosParameter =
        params.get("videos");

    const currentTabURL =
        window.location.href;

    
    // =================================================
    // PAGE ELEMENTS
    // =================================================

    const currentPlayer =
        document.getElementById(
            "currentPlayer"
        );

    const videoList =
        document.getElementById(
            "videoList"
        );

    const message =
        document.getElementById(
            "message"
        );

    const currentTitle =
        document.getElementById(
            "currentTitle"
        );

    const currentCounter =
        document.getElementById(
            "currentCounter"
        );

    const backButton =
        document.getElementById(
            "backButton"
        );

    const forwardButton =
        document.getElementById(
            "forwardButton"
        );

    const playPauseButton =
        document.getElementById(
            "playPauseButton"
        );

     const returnSearchButton =
        document.getElementById(
            "returnSearchButton"
        );

    const debug =
        document.getElementById(
            "debug"
        );

    
    // =================================================
    // RETURN TO SEARCH BUTTON
    // =================================================
    if (currentTabURL) {
        returnSearchButton.style.display =
            "block";
        returnSearchButton.addEventListener(
            "click",
            function () {
                /*
                 * The URL scheme below launches the
                 * "Return to YouTube Search" Shortcut.
                 *
                 * The original YouTube search URL is
                 * passed into the Shortcut as text.
                 */
                const shortcutName =
                    "Return to YouTube Search";
                const shortcutURL =
                    "shortcuts://run-shortcut" +
                    "?name=" +
                    encodeURIComponent(
                        shortcutName
                    ) +
                    "&input=text" +
                    "&text=" +
                    encodeURIComponent(
                        currentTabURL
                    );
                window.location.href =
                    shortcutURL;
            }
        );
    }


    // =================================================
    // BASIC VALIDATION
    // =================================================

    if (!videosParameter) {

        message.textContent =
            "No YouTube video IDs were supplied.";

    } else {


        // =============================================
        // SPLIT THE VIDEO LIST
        // =============================================

        const rawIds =
            videosParameter.split(",");


        // =============================================
        // VALIDATE VIDEO IDS
        // =============================================

        let videoIds =
            rawIds
                .map(
                    id => id.trim()
                )
                .filter(
                    id =>
                        /^[A-Za-z0-9_-]{11}$/.test(id)
                );


        // =============================================
        // REMOVE DUPLICATES
        // =============================================

        videoIds =
            [...new Set(videoIds)];


        // =============================================
        // DEBUG DISPLAY
        // =============================================

        debug.textContent =
            "Received video IDs:\n\n" +
            videoIds.join("\n") +
            "\n\n";
        if (currentTabURL) {
            debug.textContent +=
                "Original search URL:\n\n" +
                currentTabURL;
        }


        // =============================================
        // MAKE SURE WE HAVE VIDEOS
        // =============================================

        if (videoIds.length === 0) {

            message.textContent =
                "No valid YouTube video IDs were found.";

        } else {


            // =========================================
            // CURRENT VIDEO INDEX
            // =========================================

            let currentIndex = 0;


            // =========================================
            // PLAY STATE
            //
            // NOTE:
            // The iframe itself does not expose a
            // reliable play/pause interface unless we
            // use the YouTube IFrame Player API.
            //
            // For now this variable tracks what the
            // button is requesting.
            // =========================================

            let isPlaying = true;


            // =========================================
            // LOAD CURRENT VIDEO
            // =========================================

            function loadCurrentVideo() {

                const id =
                    videoIds[currentIndex];


                // -------------------------------------
                // Load the selected video
                // -------------------------------------

                currentPlayer.src =
                    "https://www.youtube.com/embed/" +
                    encodeURIComponent(id) +
                    "?autoplay=1";


                // -------------------------------------
                // Update information
                // -------------------------------------

                currentTitle.textContent =
                    "YouTube Video " +
                    (currentIndex + 1);


                currentCounter.textContent =
                    (currentIndex + 1) +
                    " / " +
                    videoIds.length;


                // -------------------------------------
                // Update button states
                // -------------------------------------

                backButton.disabled =
                    currentIndex === 0;

                forwardButton.disabled =
                    currentIndex ===
                    videoIds.length - 1;


                // -------------------------------------
                // Rebuild lower video list
                // -------------------------------------

                buildVideoList();


                // -------------------------------------
                // Reset play state
                // -------------------------------------

                isPlaying = true;

                playPauseButton.textContent =
                    "❚❚";
            }


            // =========================================
            // BUILD LOWER VIDEO LIST
            // =========================================

            function buildVideoList() {

                videoList.innerHTML = "";


                videoIds.forEach(
                    (id, index) => {

                        // Don't display the currently
                        // selected video again below.

                        if (
                            index === currentIndex
                        ) {
                            return;
                        }


                        // ---------------------------------
                        // Card
                        // ---------------------------------

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "videoCard";


                        // ---------------------------------
                        // Iframe
                        // ---------------------------------

                        const iframe =
                            document.createElement(
                                "iframe"
                            );


                        iframe.src =
                            "https://www.youtube.com/embed/" +
                            encodeURIComponent(id);


                        iframe.allow =
                            "autoplay; encrypted-media; picture-in-picture";


                        iframe.allowFullscreen =
                            true;


                        // ---------------------------------
                        // Label
                        // ---------------------------------

                        const label =
                            document.createElement(
                                "div"
                            );

                        label.className =
                            "videoCardLabel";


                        label.textContent =
                            "Video " +
                            (index + 1);


                        // ---------------------------------
                        // Clicking a lower video makes
                        // it the current video.
                        // ---------------------------------

                        card.addEventListener(
                            "click",
                            function () {

                                currentIndex =
                                    index;

                                loadCurrentVideo();
                            }
                        );


                        // ---------------------------------
                        // Assemble card
                        // ---------------------------------

                        card.appendChild(
                            iframe
                        );

                        card.appendChild(
                            label
                        );

                        videoList.appendChild(
                            card
                        );

                    }
                );
            }


            // =========================================
            // BACK BUTTON
            // =========================================

            backButton.addEventListener(
                "click",
                function () {

                    if (currentIndex > 0) {

                        currentIndex--;

                        loadCurrentVideo();
                    }

                }
            );


            // =========================================
            // FORWARD BUTTON
            // =========================================

            forwardButton.addEventListener(
                "click",
                function () {

                    if (
                        currentIndex <
                        videoIds.length - 1
                    ) {

                        currentIndex++;

                        loadCurrentVideo();
                    }

                }
            );


            // =========================================
            // PLAY / PAUSE BUTTON
            //
            // IMPORTANT:
            //
            // At this stage this only changes the
            // button state. True control of the YouTube
            // iframe requires the YouTube IFrame Player
            // API.
            //
            // We'll add that next if desired.
            // =========================================

            playPauseButton.addEventListener(
                "click",
                function () {

                    if (isPlaying) {

                        playPauseButton.textContent =
                            "▶";

                        isPlaying = false;

                    } else {

                        playPauseButton.textContent =
                            "❚❚";

                        isPlaying = true;

                    }

                }
            );


            // =========================================
            // INITIALIZE
            // =========================================

            message.textContent = "";

            loadCurrentVideo();

        }

    }

</script>

</body>

</html>
