<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>YouTube Background Playback Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .player {
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>iOS YouTube Background Playback Test 11</h1>

    <p>
        Play the video, do NOT activate Picture-in-Picture,
        then lock the iPhone.
    </p>

    <div class="player">
    
        <button id="testButton">
            Start Background Audio Test
        </button>
    
        <audio id="keepAlive" playsinline></audio>
    
        <iframe
            id="youtube"
            src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE?playsinline=1&enablejsapi=1"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

            // Tell iOS Safari that this page is intended for media playback.
            if ("audioSession" in navigator) {
                navigator.audioSession.type = "playback";
            }

            const testButton = document.getElementById("testButton");

            keepAlive.loop = true;
    
            testButton.addEventListener("click", async () => {
                try {
                    if ("audioSession" in navigator) {
                        navigator.audioSession.type = "playback";
                    }
    
                    await keepAlive.play();
    
                    const iframe = document.getElementById("youtube");
    
                    iframe.contentWindow.postMessage(
                        JSON.stringify({
                            event: "command",
                            func: "playVideo",
                            args: []
                        }),
                        "https://www.youtube-nocookie.com"
                    );
    
                    testButton.textContent = "Playing — now lock the phone";
    
                } catch (error) {
                    testButton.textContent = "Error: " + error;
                    console.error(error);
                }
            });
        </script>
    
    </div>
    <button onclick="checkAudioSession()">Check Audio Session</button>
    <p id="audioSessionResult">Not checked yet.</p>
    
    <script>
    function checkAudioSession() {
        const result = document.getElementById("audioSessionResult");
    
        if (!("audioSession" in navigator)) {
            result.textContent =
                "navigator.audioSession is NOT available in this Safari.";
            return;
        }
    
        result.textContent =
            "navigator.audioSession IS available. Type: " +
            navigator.audioSession.type;
    }
    </script>
</div>

</body>
