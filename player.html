<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>YouTube Background Playback Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .player {
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>iOS YouTube Background Playback Test</h1>

    <p>
        Play the video, do NOT activate Picture-in-Picture,
        then lock the iPhone.
    </p>

    <div class="player">

        <iframe
            src="https://www.youtube-nocookie.com/embed/qb4azt5c6yc?playsinline=1"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

</div>

</body>
</html>
