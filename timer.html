<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>Interval Alarm</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #111;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 10px;
        font-size: 28px;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    label {
        display: block;
        margin-top: 20px;
        font-size: 18px;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        font-size: 22px;
        text-align: center;
        border-radius: 10px;
        border: 1px solid #555;
        background: #222;
        color: white;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        background: #333;
        color: white;
    }

    button:active {
        background: #555;
    }

    #startButton {
        background: #087f23;
    }

    #stopButton {
        background: #9b1515;
    }

    #status {
        margin-top: 25px;
        font-size: 20px;
        min-height: 30px;
    }

    #timer {
        margin-top: 10px;
        font-size: 48px;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
    }

    #audioInfo {
        margin-top: 20px;
        font-size: 14px;
        color: #aaa;
        line-height: 1.5;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
    }

    #log {
        margin-top: 20px;
        padding: 10px;
        background: #050505;
        border: 1px solid #333;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        text-align: left;
        white-space: pre-wrap;
        max-height: 250px;
        overflow-y: auto;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Interval Alarm</h1>

    <label for="intervalInput">
        Interval (seconds)
    </label>

    <input
        id="intervalInput"
        type="number"
        min="0.1"
        max="60"
        step="0.1"
        value="5"
    >

    <button id="generateButton">
        Generate Audio
    </button>

    <button id="startButton">
        Start
    </button>

    <button id="stopButton">
        Stop
    </button>

    <div id="status">
        Ready
    </div>

    <div id="timer">
        0.0
    </div>

    <div id="audioInfo"></div>

    <div id="log"></div>

</div>

<audio id="alarmAudio"
       preload="auto"
       playsinline></audio>

<script>

"use strict";

/* ============================================================
   CONFIGURATION
   ============================================================ */

const SAMPLE_RATE = 8000;

// Entire native audio track.
const TRACK_SECONDS = 70;

// Normal interval activity only occurs during this window.
const ACTIVE_SECONDS = 60;

// Final portion reserved for loop marker.
const LOOP_MARKER_START = 69;

// How long each normal alarm lasts.
const BLIP_DURATION = 0.18;


/* ============================================================
   DOM
   ============================================================ */

const intervalInput =
    document.getElementById("intervalInput");

const generateButton =
    document.getElementById("generateButton");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const status =
    document.getElementById("status");

const timer =
    document.getElementById("timer");

const audioInfo =
    document.getElementById("audioInfo");

const logElement =
    document.getElementById("log");

const audio =
    document.getElementById("alarmAudio");


/* ============================================================
   STATE
   ============================================================ */

let currentInterval = 5;

let audioURL = null;

let timerAnimationFrame = null;

let startPerformanceTime = 0;


/* ============================================================
   LOGGING
   ============================================================ */

function log(message) {

    const now = new Date();

    const timestamp =
        now.toLocaleTimeString() + "." +
        String(now.getMilliseconds()).padStart(3, "0");

    logElement.textContent +=
        "[" + timestamp + "] " + message + "\n";

    logElement.scrollTop = logElement.scrollHeight;
}


/* ============================================================
   WAV UTILITIES
   ============================================================ */

function writeString(view, offset, string) {

    for (let i = 0; i < string.length; i++) {
        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );
    }
}


function createWavBlob(samples, sampleRate) {

    const numChannels = 1;
    const bitsPerSample = 16;

    const dataSize =
        samples.length * 2;

    const buffer =
        new ArrayBuffer(44 + dataSize);

    const view =
        new DataView(buffer);


    // RIFF header
    writeString(view, 0, "RIFF");

    view.setUint32(
        4,
        36 + dataSize,
        true
    );

    writeString(view, 8, "WAVE");


    // fmt chunk
    writeString(view, 12, "fmt ");

    view.setUint32(
        16,
        16,
        true
    );

    // PCM
    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        numChannels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate *
        numChannels *
        bitsPerSample / 8,
        true
    );

    view.setUint16(
        32,
        numChannels *
        bitsPerSample / 8,
        true
    );

    view.setUint16(
        34,
        bitsPerSample,
        true
    );


    // data chunk
    writeString(view, 36, "data");

    view.setUint32(
        40,
        dataSize,
        true
    );


    // Samples
    let offset = 44;

    for (let i = 0; i < samples.length; i++) {

        let sample = samples[i];

        sample =
            Math.max(-1, Math.min(1, sample));

        view.setInt16(
            offset,
            sample < 0
                ? sample * 32768
                : sample * 32767,
            true
        );

        offset += 2;
    }


    return new Blob(
        [buffer],
        { type: "audio/wav" }
    );
}


/* ============================================================
   SOUND GENERATORS
   ============================================================ */

/*
   Normal alarm:

   Aggressive short burst consisting of multiple harmonics
   with a fast attack and decay.
*/

function addBlip(
    samples,
    startTime,
    sampleRate
) {

    const start =
        Math.floor(
            startTime * sampleRate
        );

    const length =
        Math.floor(
            BLIP_DURATION * sampleRate
        );

    const frequencies = [
        900,
        1350,
        1800,
        2700
    ];


    for (let i = 0; i < length; i++) {

        const index =
            start + i;

        if (index < 0 || index >= samples.length) {
            continue;
        }

        const t =
            i / sampleRate;

        const progress =
            i / length;


        /*
           Fast attack, fairly aggressive decay.
        */

        const envelope =
            Math.pow(
                1 - progress,
                2.2
            );


        let value = 0;

        for (const frequency of frequencies) {

            value +=
                Math.sin(
                    2 * Math.PI *
                    frequency * t
                );
        }


        value /=
            frequencies.length;


        /*
           Add some square-wave character
           for a harsher alarm sound.
        */

        const square =
            Math.sign(
                Math.sin(
                    2 * Math.PI *
                    1800 * t
                )
            );


        value =
            value * 0.65 +
            square * 0.35;


        samples[index] +=
            value *
            envelope *
            0.95;
    }
}


/*
   Distinctive start sound:
   rising two-tone.
*/

function addStartSound(
    samples,
    startTime,
    sampleRate
) {

    const duration = 0.45;

    const start =
        Math.floor(
            startTime * sampleRate
        );

    const length =
        Math.floor(
            duration * sampleRate
        );


    for (let i = 0; i < length; i++) {

        const index =
            start + i;

        if (index >= samples.length) {
            continue;
        }

        const t =
            i / sampleRate;

        let frequency;

        if (t < 0.20) {
            frequency = 700;
        } else {
            frequency = 1200;
        }

        const localT =
            t < 0.20
                ? t
                : t - 0.20;


        const envelope =
            Math.min(
                1,
                localT / 0.015
            ) *
            Math.pow(
                1 - t / duration,
                1.5
            );


        samples[index] +=
            Math.sin(
                2 * Math.PI *
                frequency * t
            ) *
            envelope *
            0.8;
    }
}


/*
   Distinctive loop marker.

   This should sound obviously different from
   the normal alarm.
*/

function addLoopSound(
    samples,
    startTime,
    sampleRate
) {

    const duration = 0.8;

    const start =
        Math.floor(
            startTime * sampleRate
        );

    const length =
        Math.floor(
            duration * sampleRate
        );


    for (let i = 0; i < length; i++) {

        const index =
            start + i;

        if (index >= samples.length) {
            continue;
        }

        const t =
            i / sampleRate;


        /*
           Three descending tones.
        */

        let frequency;

        if (t < 0.25) {
            frequency = 1600;
        }
        else if (t < 0.50) {
            frequency = 1100;
        }
        else {
            frequency = 700;
        }


        const envelope =
            Math.min(
                1,
                t / 0.015
            ) *
            Math.pow(
                1 - t / duration,
                1.4
            );


        const tone =
            Math.sin(
                2 * Math.PI *
                frequency *
                t
            );


        /*
           Add a second harmonic to make
           the loop marker more recognizable.
        */

        const harmonic =
            0.35 *
            Math.sin(
                2 * Math.PI *
                frequency * 2 *
                t
            );


        samples[index] +=
            (tone + harmonic) *
            envelope *
            0.85;
    }
}


/* ============================================================
   GENERATE THE 70-SECOND TRACK
   ============================================================ */

function generateAudio() {

    const interval =
        Number(intervalInput.value);


    if (!Number.isFinite(interval)) {

        status.textContent =
            "Enter a valid interval.";

        return;
    }


    if (interval <= 0) {

        status.textContent =
            "Interval must be greater than zero.";

        return;
    }


    if (interval > ACTIVE_SECONDS) {

        status.textContent =
            "Interval must be 60 seconds or less.";

        return;
    }


    currentInterval = interval;


    status.textContent =
        "Generating 70-second audio...";


    log("");
    log("================================");
    log("GENERATING AUDIO");
    log("Interval = " +
        interval.toFixed(3) +
        " s");
    log("Track = " +
        TRACK_SECONDS.toFixed(3) +
        " s");
    log("Active window = " +
        ACTIVE_SECONDS.toFixed(3) +
        " s");
    log("Sample rate = " +
        SAMPLE_RATE +
        " Hz");


    /*
       Number of samples in exactly 70 seconds.
    */

    const totalSamples =
        Math.round(
            TRACK_SECONDS *
            SAMPLE_RATE
        );


    const samples =
        new Float32Array(
            totalSamples
        );


    /*
       START SOUND
    */

    addStartSound(
        samples,
        0.05,
        SAMPLE_RATE
    );


    /*
       NORMAL BLIPS

       Start at the entered interval.

       We deliberately do NOT put a normal
       blip at exactly t = 0 because the start
       sound already indicates activation.
    */

    let blipCount = 0;

    for (
        let time = interval;
        time < ACTIVE_SECONDS;
        time += interval
    ) {

        /*
           Leave enough room for the loop marker.
        */

        if (
            time + BLIP_DURATION >=
            LOOP_MARKER_START
        ) {
            break;
        }


        addBlip(
            samples,
            time,
            SAMPLE_RATE
        );

        blipCount++;
    }


    /*
       DISTINCTIVE LOOP MARKER
    */

    addLoopSound(
        samples,
        LOOP_MARKER_START,
        SAMPLE_RATE
    );


    /*
       Prevent any numerical overshoot
       from exceeding the valid PCM range.
    */

    for (let i = 0; i < samples.length; i++) {

        if (samples[i] > 1) {
            samples[i] = 1;
        }
        else if (samples[i] < -1) {
            samples[i] = -1;
        }
    }


    const blob =
        createWavBlob(
            samples,
            SAMPLE_RATE
        );


    /*
       Release the previous Blob URL.
    */

    if (audioURL !== null) {

        URL.revokeObjectURL(
            audioURL
        );
    }


    audioURL =
        URL.createObjectURL(blob);


    audio.src =
        audioURL;

    audio.loop = true;


    /*
       Force Safari to recognize the
       newly generated media.
    */

    audio.load();


    const sizeMB =
        blob.size /
        (1024 * 1024);


    audioInfo.textContent =
        "Interval: " +
        interval.toFixed(3) +
        " s\n" +

        "Track duration: " +
        TRACK_SECONDS.toFixed(3) +
        " s\n" +

        "Normal blips: " +
        blipCount +
        "\n" +

        "Normal-blip window: 0–60 s\n" +

        "Loop marker: 69–69.8 s\n" +

        "Sample rate: " +
        SAMPLE_RATE +
        " Hz\n" +

        "WAV size: " +
        sizeMB.toFixed(2) +
        " MB\n" +

        "Audio loop: NATIVE";


    status.textContent =
        "Audio generated — ready";


    log(
        "Samples = " +
        totalSamples
    );

    log(
        "Nominal duration = " +
        (
            totalSamples /
            SAMPLE_RATE
        ).toFixed(6) +
        " s"
    );

    log(
        "Blips generated = " +
        blipCount
    );

    log(
        "WAV size = " +
        sizeMB.toFixed(2) +
        " MB"
    );

    log(
        "Native audio loop enabled."
    );


    /*
       Wait for metadata so we can report
       what Safari actually thinks the duration is.
    */

    audio.addEventListener(
        "loadedmetadata",
        function metadataHandler() {

            audio.removeEventListener(
                "loadedmetadata",
                metadataHandler
            );


            log(
                "Safari audio.duration = " +
                audio.duration.toFixed(6) +
                " s"
            );


            log(
                "Safari duration error = " +
                (
                    audio.duration -
                    TRACK_SECONDS
                ).toFixed(6) +
                " s"
            );
        }
    );
}


/* ============================================================
   START
   ============================================================ */

async function startAlarm() {

    if (!audio.src) {

        generateAudio();
    }


    /*
       Safari requires a user gesture for
       starting media. This function is called
       directly by the Start button.
    */

    try {

        audio.currentTime = 0;

        await audio.play();


        startPerformanceTime =
            performance.now();


        status.textContent =
            "RUNNING";


        log("");
        log("================================");
        log("START");
        log(
            "Interval = " +
            currentInterval.toFixed(3) +
            " s"
        );

        log(
            "audio.duration = " +
            (
                Number.isFinite(audio.duration)
                    ? audio.duration.toFixed(6)
                    : "unknown"
            ) +
            " s"
        );

        log(
            "Native looping = " +
            audio.loop
        );


        updateTimer();

    }
    catch (error) {

        status.textContent =
            "Unable to start audio";

        log(
            "PLAY ERROR: " +
            error
        );
    }
}


/* ============================================================
   STOP
   ============================================================ */

function stopAlarm() {

    audio.pause();

    audio.currentTime = 0;


    if (timerAnimationFrame !== null) {

        cancelAnimationFrame(
            timerAnimationFrame
        );

        timerAnimationFrame = null;
    }


    timer.textContent =
        "0.0";


    status.textContent =
        "Stopped";


    log("");
    log("STOP");
}


/* ============================================================
   SCREEN TIMER
   ============================================================ */

/*
   IMPORTANT:

   This timer is informational only.

   It does NOT control the audio.

   The native audio track is the timing mechanism.
*/

function updateTimer() {

    if (audio.paused) {
        return;
    }


    /*
       audio.currentTime is the important
       value here because it represents the
       native media clock.
    */

    const mediaTime =
        audio.currentTime;


    /*
       Show time remaining until the next
       expected normal blip.

       We calculate relative to the beginning
       of the 60-second active window.
    */

    let nextBlip;

    if (mediaTime < currentInterval) {

        nextBlip =
            currentInterval;
    }
    else {

        const intervalsPassed =
            Math.ceil(
                mediaTime /
                currentInterval
            );

        nextBlip =
            intervalsPassed *
            currentInterval;
    }


    /*
       Once we're past 60 seconds, the next
       important event is the loop marker.
    */

    if (mediaTime >= ACTIVE_SECONDS) {

        timer.textContent =
            "LOOP";

    }
    else {

        const remaining =
            Math.max(
                0,
                nextBlip - mediaTime
            );


        timer.textContent =
            remaining.toFixed(2);
    }


    timerAnimationFrame =
        requestAnimationFrame(
            updateTimer
        );
}


/* ============================================================
   AUDIO EVENTS
   ============================================================ */

audio.addEventListener(
    "play",
    function() {

        log(
            "audio PLAY event"
        );
    }
);


audio.addEventListener(
    "playing",
    function() {

        log(
            "audio PLAYING event"
        );
    }
);


audio.addEventListener(
    "pause",
    function() {

        log(
            "audio PAUSE event"
        );
    }
);


audio.addEventListener(
    "waiting",
    function() {

        log(
            "audio WAITING event at currentTime=" +
            audio.currentTime.toFixed(6)
        );
    }
);


audio.addEventListener(
    "timeupdate",
    function() {

        /*
           Intentionally not logging every event,
           because Safari can generate many of them.
        */
    }
);


/*
   With loop=true, we should NOT normally receive
   an ended event at every 70-second boundary.

   If Safari ever does emit one, log it.
*/

audio.addEventListener(
    "ended",
    function() {

        log(
            "UNEXPECTED ENDED event at currentTime=" +
            audio.currentTime.toFixed(6)
        );
    }
);


/* ============================================================
   BUTTONS
   ============================================================ */

generateButton.addEventListener(
    "click",
    generateAudio
);


startButton.addEventListener(
    "click",
    startAlarm
);


stopButton.addEventListener(
    "click",
    stopAlarm
);


/* ============================================================
   INITIAL GENERATION
   ============================================================ */

generateAudio();

</script>

</body>
</html>
