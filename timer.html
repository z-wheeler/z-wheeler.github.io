<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>iPhone Interval Alarm Diagnostic</title>

<style>

    body {
        margin: 0;
        padding: 25px 15px;
        background: #111;
        color: white;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            sans-serif;
    }

    h1 {
        text-align: center;
        font-size: 27px;
    }

    .controls {
        text-align: center;
    }

    label {
        display: block;
        font-size: 18px;
        margin-top: 20px;
        margin-bottom: 8px;
    }

    input {
        width: 120px;
        padding: 10px;
        font-size: 25px;
        text-align: center;
        border-radius: 10px;
        border: none;
    }

    button {
        font-size: 20px;
        padding: 14px 25px;
        margin: 10px 5px;
        border: none;
        border-radius: 12px;
    }

    #startButton {
        background: #34c759;
        color: white;
    }

    #stopButton {
        background: #ff3b30;
        color: white;
    }

    #countdown {
        text-align: center;
        font-size: 50px;
        font-weight: bold;
        margin: 25px 0 10px;
        font-variant-numeric: tabular-nums;
    }

    #status {
        text-align: center;
        white-space: pre-line;
        font-size: 17px;
        margin-bottom: 20px;
    }

    #diagnostics {
        background: #222;
        border-radius: 12px;
        padding: 15px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    #log {
        margin-top: 15px;
        background: #181818;
        border-radius: 12px;
        padding: 12px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        max-height: 300px;
        overflow-y: auto;
    }

    .section {
        margin-top: 20px;
        font-weight: bold;
        color: #aaa;
    }

</style>

</head>


<body>


<h1>⏱ Interval Alarm Diagnostic</h1>


<div class="controls">

    <label for="interval">
        Alarm interval
    </label>

    <input
        id="interval"
        type="number"
        min="1"
        max="300"
        step="1"
        value="5"
    >

    <span>seconds</span>

    <br>

    <button id="startButton">
        START
    </button>

    <button id="stopButton">
        STOP
    </button>

</div>


<div id="countdown">
    --
</div>


<div id="status">
    Stopped
</div>


<div class="section">
    AUDIO DIAGNOSTICS
</div>


<div id="diagnostics">
Waiting for test...
</div>


<div class="section">
    EVENT LOG
</div>


<div id="log">
No events yet.
</div>


<audio
    id="audio"
    playsinline
    preload="auto">
</audio>


<script>


/*
============================================================
CONFIGURATION
============================================================
*/


const SAMPLE_RATE = 44100;

const ALARM_DURATION = 0.18;

const MIN_INTERVAL = 1;

const MAX_INTERVAL = 300;


/*
============================================================
DOM
============================================================
*/


const audio =
    document.getElementById("audio");

const intervalInput =
    document.getElementById("interval");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const countdown =
    document.getElementById("countdown");

const status =
    document.getElementById("status");

const diagnostics =
    document.getElementById("diagnostics");

const logElement =
    document.getElementById("log");


/*
============================================================
STATE
============================================================
*/


let running = false;

let requestedInterval = 0;

let cycleNumber = 0;

let countdownTimer = null;


/*
    High-resolution JavaScript timestamps.
*/

let testStartPerformance = 0;

let lastCyclePerformance = null;


/*
    These record the actual beginning of each audio cycle.
*/

let cycleStartTimes = [];


/*
    The generated WAV URL.
*/

let currentAudioURL = null;


/*
============================================================
EVENT LOGGING
============================================================
*/


function logEvent(message) {

    const now =
        new Date();

    const timestamp =
        now.toLocaleTimeString(
            undefined,
            {
                hour12: false,
                fractionalSecondDigits: 3
            }
        );

    if (
        logElement.textContent ===
        "No events yet."
    ) {

        logElement.textContent = "";

    }

    logElement.textContent +=
        "[" +
        timestamp +
        "] " +
        message +
        "\n";


    /*
        Automatically scroll to newest event.
    */

    logElement.scrollTop =
        logElement.scrollHeight;

}


/*
============================================================
WAV HELPERS
============================================================
*/


function writeString(
    view,
    offset,
    string
) {

    for (
        let i = 0;
        i < string.length;
        i++
    ) {

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


function write16(
    view,
    offset,
    value
) {

    view.setUint16(
        offset,
        value,
        true
    );

}


function write32(
    view,
    offset,
    value
) {

    view.setUint32(
        offset,
        value,
        true
    );

}


/*
============================================================
CREATE WAV
============================================================
*/


function createIntervalWav(
    intervalSeconds
) {


    /*
        EXACT number of PCM samples.

        The nominal WAV duration is therefore:

            totalSamples / 44100

        seconds.
    */

    const totalSamples =
        Math.floor(
            SAMPLE_RATE *
            intervalSeconds
        );


    const dataBytes =
        totalSamples * 2;


    const buffer =
        new ArrayBuffer(
            44 + dataBytes
        );


    const view =
        new DataView(buffer);


    /*
    --------------------------------------------------------
    WAV HEADER
    --------------------------------------------------------
    */


    writeString(
        view,
        0,
        "RIFF"
    );


    write32(
        view,
        4,
        36 + dataBytes
    );


    writeString(
        view,
        8,
        "WAVE"
    );


    writeString(
        view,
        12,
        "fmt "
    );


    write32(
        view,
        16,
        16
    );


    /*
        PCM
    */

    write16(
        view,
        20,
        1
    );


    /*
        Mono
    */

    write16(
        view,
        22,
        1
    );


    /*
        Sample rate
    */

    write32(
        view,
        24,
        SAMPLE_RATE
    );


    /*
        Byte rate
    */

    write32(
        view,
        28,
        SAMPLE_RATE * 2
    );


    /*
        Block alignment
    */

    write16(
        view,
        32,
        2
    );


    /*
        Bits per sample
    */

    write16(
        view,
        34,
        16
    );


    writeString(
        view,
        36,
        "data"
    );


    write32(
        view,
        40,
        dataBytes
    );


    /*
    --------------------------------------------------------
    AUDIO DATA
    --------------------------------------------------------
    */


    const alarmSamples =
        Math.floor(
            SAMPLE_RATE *
            ALARM_DURATION
        );


    for (
        let i = 0;
        i < totalSamples;
        i++
    ) {


        let sample = 0;


        /*
            The alarm occurs at the VERY BEGINNING of
            each interval.

            Everything after the alarm is silence.
        */

        if (
            i < alarmSamples
        ) {


            const t =
                i / SAMPLE_RATE;


            const progress =
                i / alarmSamples;


            /*
                Downward frequency sweep:
                3000 Hz → 2100 Hz
            */

            const frequency =
                3000 -
                900 * progress;


            const fundamental =
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    t
                );


            const harmonic2 =
                0.65 *
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    2 *
                    t
                );


            const harmonic3 =
                0.30 *
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    3 *
                    t
                );


            /*
                Very sharp attack/release.
            */

            let envelope;


            if (
                progress < 0.015
            ) {

                envelope =
                    progress /
                    0.015;

            }

            else if (
                progress > 0.72
            ) {

                envelope =
                    (1 - progress) /
                    0.28;

            }

            else {

                envelope = 1;

            }


            sample =
                (
                    fundamental +
                    harmonic2 +
                    harmonic3
                )
                *
                0.72
                *
                envelope;


            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

        }


        view.setInt16(
            44 + i * 2,
            sample * 32767,
            true
        );

    }


    /*
    --------------------------------------------------------
    BASE64
    --------------------------------------------------------
    */


    const bytes =
        new Uint8Array(buffer);


    let binary = "";

    const CHUNK_SIZE =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += CHUNK_SIZE
    ) {

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i + CHUNK_SIZE,
                        bytes.length
                    )
                )
            );

    }


    const base64 =
        btoa(binary);


    return {
        url:
            "data:audio/wav;base64," +
            base64,

        totalSamples:
            totalSamples,

        nominalDuration:
            totalSamples /
            SAMPLE_RATE,

        dataBytes:
            dataBytes

    };

}


/*
============================================================
UPDATE DIAGNOSTICS
============================================================
*/


function updateDiagnostics() {


    if (!audio.src) {

        diagnostics.textContent =
            "No audio loaded.";

        return;

    }


    const actualAudioDuration =
        audio.duration;


    const currentTime =
        audio.currentTime;


    const readyState =
        audio.readyState;


    const networkState =
        audio.networkState;


    const paused =
        audio.paused;


    const ended =
        audio.ended;


    let elapsedTestTime =
        0;


    if (
        testStartPerformance > 0
    ) {

        elapsedTestTime =
            (
                performance.now() -
                testStartPerformance
            ) / 1000;

    }


    diagnostics.textContent =

        "Requested interval: " +
        requestedInterval.toFixed(6) +
        " s\n" +

        "\n" +

        "audio.duration: " +
        (
            Number.isFinite(
                actualAudioDuration
            )
            ? actualAudioDuration.toFixed(6)
            : "not available"
        ) +
        " s\n" +

        "audio.currentTime: " +
        currentTime.toFixed(6) +
        " s\n" +

        "\n" +

        "WAV nominal duration: " +
        (
            window.wavInfo
                ? window.wavInfo.nominalDuration.toFixed(6)
                : "unknown"
        ) +
        " s\n" +

        "WAV sample count: " +
        (
            window.wavInfo
                ? window.wavInfo.totalSamples
                : "unknown"
        ) +
        "\n" +

        "Sample rate: " +
        SAMPLE_RATE +
        " Hz\n" +

        "\n" +

        "Nominal duration error: " +
        (
            window.wavInfo
                ? (
                    window.wavInfo.nominalDuration -
                    requestedInterval
                ).toFixed(6)
                : "unknown"
        ) +
        " s\n" +

        "Safari duration error: " +
        (
            Number.isFinite(
                actualAudioDuration
            )
            ? (
                actualAudioDuration -
                requestedInterval
            ).toFixed(6)
            : "unknown"
        ) +
        " s\n" +

        "\n" +

        "Cycle number: " +
        cycleNumber +
        "\n" +

        "Test elapsed: " +
        elapsedTestTime.toFixed(3) +
        " s\n" +

        "\n" +

        "paused: " +
        paused +
        "\n" +

        "ended: " +
        ended +
        "\n" +

        "readyState: " +
        readyState +
        "\n" +

        "networkState: " +
        networkState;


}


/*
============================================================
COUNTDOWN

IMPORTANT:

This is ONLY diagnostic.

It does NOT control the alarm.

============================================================
*/


function updateCountdown() {


    if (!running) {
        return;
    }


    /*
        Use the actual audio position rather than
        performance.now().

        This allows us to see whether the visual display
        follows Safari's media clock.
    */

    const duration =
        audio.duration;


    const position =
        audio.currentTime;


    if (
        Number.isFinite(duration) &&
        duration > 0
    ) {

        let remaining =
            duration -
            position;


        /*
            Don't let rounding produce a negative number.
        */

        remaining =
            Math.max(
                0,
                remaining
            );


        countdown.textContent =
            remaining.toFixed(3) +
            " s";

    }

    else {

        countdown.textContent =
            "--";

    }


    updateDiagnostics();

}


/*
============================================================
AUDIO PLAY EVENT
============================================================
*/


audio.addEventListener(
    "play",
    () => {

        logEvent(
            "audio PLAY event"
        );

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO PLAYING EVENT
============================================================
*/


audio.addEventListener(
    "playing",
    () => {

        logEvent(
            "audio PLAYING event"
        );

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO TIMEUPDATE
============================================================
*/


audio.addEventListener(
    "timeupdate",
    () => {

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO WAITING
============================================================
*/


audio.addEventListener(
    "waiting",
    () => {

        logEvent(
            "audio WAITING — playback stalled"
        );

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO STALLED
============================================================
*/


audio.addEventListener(
    "stalled",
    () => {

        logEvent(
            "audio STALLED"
        );

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO PAUSE
============================================================
*/


audio.addEventListener(
    "pause",
    () => {

        logEvent(
            "audio PAUSE event"
        );

        if (running) {

            status.textContent =
                "WARNING:\n" +
                "Safari paused the audio.";

        }

        updateDiagnostics();

    }
);


/*
============================================================
AUDIO ENDED

THIS IS THE MOST IMPORTANT DIAGNOSTIC EVENT.

Because audio.loop = false, reaching this event means
Safari believes it has reached the END of the WAV.

We record exactly how long the previous cycle lasted.

============================================================
*/


audio.addEventListener(
    "ended",
    async () => {


        if (!running) {
            return;
        }


        const now =
            performance.now();


        cycleNumber++;


        /*
            Calculate actual wall-clock time between
            the starts/restarts of audio cycles.
        */

        let cycleInterval =
            null;


        if (
            lastCyclePerformance !== null
        ) {

            cycleInterval =
                (
                    now -
                    lastCyclePerformance
                ) / 1000;

        }


        lastCyclePerformance =
            now;


        cycleStartTimes.push(
            now
        );


        /*
            Diagnostic log.
        */

        if (
            cycleInterval !== null
        ) {

            logEvent(
                "AUDIO ENDED / RESTART #" +
                cycleNumber +
                " — actual cycle interval = " +
                cycleInterval.toFixed(6) +
                " s"
            );

        }

        else {

            logEvent(
                "AUDIO ENDED / RESTART #" +
                cycleNumber
            );

        }


        updateDiagnostics();


        /*
        ====================================================
        RESTART AUDIO
        ====================================================
        */


        audio.currentTime = 0;


        try {

            await audio.play();

        }

        catch (error) {

            logEvent(
                "RESTART FAILED: " +
                error
            );


            status.textContent =
                "Audio restart failed:\n" +
                error;

            running = false;

            return;

        }


        /*
            Record the restart as accurately as possible.
        */

        const restartNow =
            performance.now();


        /*
            If the play() promise itself takes significant
            time, record it in the log.
        */

        const restartDelay =
            (
                restartNow -
                now
            ) / 1000;


        if (
            restartDelay > 0.01
        ) {

            logEvent(
                "Restart delay after ENDED = " +
                restartDelay.toFixed(6) +
                " s"
            );

        }


        updateDiagnostics();

    }
);


/*
============================================================
ERROR
============================================================
*/


audio.addEventListener(
    "error",
    () => {

        logEvent(
            "AUDIO ERROR"
        );


        if (
            audio.error
        ) {

            logEvent(
                "MediaError code = " +
                audio.error.code
            );

        }


        status.textContent =
            "Audio error.";

    }
);


/*
============================================================
START
============================================================
*/


async function startAlarm() {


    if (running) {
        return;
    }


    const seconds =
        Number(
            intervalInput.value
        );


    if (
        !Number.isFinite(seconds) ||
        seconds < MIN_INTERVAL ||
        seconds > MAX_INTERVAL
    ) {

        status.textContent =
            "Enter an interval from " +
            MIN_INTERVAL +
            " to " +
            MAX_INTERVAL +
            " seconds.";

        return;

    }


    requestedInterval =
        seconds;


    /*
        Clear old log.
    */

    logElement.textContent =
        "";


    /*
        Generate WAV.
    */

    status.textContent =
        "Generating audio track...";


    const wavInfo =
        createIntervalWav(
            seconds
        );


    /*
        Make the information globally available
        to the diagnostic display.
    */

    window.wavInfo =
        wavInfo;


    /*
        Load audio.
    */

    audio.src =
        wavInfo.url;


    /*
        VERY IMPORTANT:

        Do NOT use audio.loop.

        We want the "ended" event so we can measure
        exactly when Safari reaches the end.
    */

    audio.loop = false;


    audio.volume = 1.0;


    /*
        Reset counters.
    */

    cycleNumber = 0;

    cycleStartTimes = [];


    /*
        Start high-resolution diagnostic clock.
    */

    testStartPerformance =
        performance.now();


    lastCyclePerformance =
        testStartPerformance;


    /*
        The first audio cycle starts HERE.

        The actual acoustic sound may be delayed slightly
        by the hardware/audio pipeline, but this gives us
        the browser-side reference.
    */

    cycleStartTimes.push(
        testStartPerformance
    );


    /*
        Update diagnostics before playback.
    */

    updateDiagnostics();


    /*
    ========================================================
    USER GESTURE → AUDIO PLAYBACK
    ========================================================
    */


    try {

        await audio.play();

    }

    catch (error) {

        status.textContent =
            "Safari blocked audio playback.\n\n" +
            String(error);

        logEvent(
            "INITIAL PLAY FAILED: " +
            String(error)
        );

        return;

    }


    running = true;


    intervalInput.disabled =
        true;


    status.textContent =
        "RUNNING\n\n" +
        "Audio engine is the alarm clock.";


    logEvent(
        "START — requested interval = " +
        seconds.toFixed(6) +
        " s"
    );


    logEvent(
        "WAV nominal duration = " +
        wavInfo.nominalDuration.toFixed(6) +
        " s"
    );


    /*
        Visual diagnostics update frequently.

        Again, this timer does NOT control the alarm.
    */

    countdownTimer =
        setInterval(
            updateCountdown,
            50
        );


    updateDiagnostics();

}


/*
============================================================
STOP
============================================================
*/


function stopAlarm() {


    running = false;


    if (
        countdownTimer !== null
    ) {

        clearInterval(
            countdownTimer
        );

        countdownTimer = null;

    }


    audio.pause();


    audio.currentTime = 0;


    intervalInput.disabled =
        false;


    countdown.textContent =
        "--";


    status.textContent =
        "Stopped";


    logEvent(
        "STOP"
    );


    updateDiagnostics();

}


/*
============================================================
BUTTONS
============================================================
*/


startButton.addEventListener(
    "click",
    startAlarm
);


stopButton.addEventListener(
    "click",
    stopAlarm
);


</script>

</body>

</html>
