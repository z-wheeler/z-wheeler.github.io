<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>iPhone Pocket Interval Alarm</title>

<style>

    body {
        margin: 0;
        padding: 30px 20px;
        background: #111;
        color: white;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            sans-serif;
        text-align: center;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 30px;
    }

    .input-container {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 18px;
        margin-bottom: 8px;
    }

    input {
        width: 130px;
        padding: 12px;
        font-size: 26px;
        text-align: center;

        border: none;
        border-radius: 10px;
    }

    .unit {
        font-size: 18px;
    }

    button {
        font-size: 20px;
        font-weight: 600;

        padding: 15px 28px;
        margin: 8px;

        border: none;
        border-radius: 12px;
    }

    #startButton {
        background: #34c759;
        color: white;
    }

    #stopButton {
        background: #ff3b30;
        color: white;
    }

    #countdown {
        margin-top: 35px;

        font-size: 52px;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
    }

    #status {
        margin-top: 20px;

        font-size: 17px;
        line-height: 1.5;

        white-space: pre-line;
    }

    #audio {
        display: none;
    }

</style>

</head>


<body>


<h1>⏱ Pocket Interval Alarm</h1>


<div class="input-container">

    <label for="interval">
        Alarm interval
    </label>

    <input
        id="interval"
        type="number"
        min="1"
        max="300"
        step="1"
        value="30"
    >

    <span class="unit">
        seconds
    </span>

</div>


<button id="startButton">
    START
</button>


<button id="stopButton">
    STOP
</button>


<div id="countdown">
    --
</div>


<div id="status">
    Stopped
</div>


<!--

    IMPORTANT:

    This is the native Safari audio element.

    Once START is pressed, this element receives a WAV
    containing the repeating alarm pattern.

    Safari therefore sees this as ordinary media playback
    rather than a JavaScript timer trying to generate
    individual sounds in the background.

-->

<audio
    id="audio"
    playsinline
    preload="auto">
</audio>


<script>


/*
============================================================
CONFIGURATION
============================================================
*/


const SAMPLE_RATE = 44100;


/*
    Length of the actual alarm.

    ~180 ms is short enough to be a "chirp",
    but long enough to be clearly noticeable.
*/

const ALARM_DURATION = 0.18;


/*
    Prevent accidentally creating enormous WAV files.
*/

const MIN_INTERVAL = 1;
const MAX_INTERVAL = 300;


/*
============================================================
ELEMENTS
============================================================
*/


const audio =
    document.getElementById("audio");

const intervalInput =
    document.getElementById("interval");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const countdown =
    document.getElementById("countdown");

const status =
    document.getElementById("status");


/*
============================================================
STATE
============================================================
*/


let running = false;

let countdownTimer = null;

let startTime = 0;

let intervalSeconds = 0;


/*
============================================================
CREATE LITTLE-ENDIAN WAV HELPERS
============================================================
*/


function writeString(view, offset, string) {

    for (let i = 0; i < string.length; i++) {

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


function write16(view, offset, value) {

    view.setUint16(
        offset,
        value,
        true
    );

}


function write32(view, offset, value) {

    view.setUint32(
        offset,
        value,
        true
    );

}


/*
============================================================
CREATE THE REPEATING AUDIO TRACK
============================================================

The resulting waveform is:

    | ALARM | silence....................... |
    | ALARM | silence....................... |
    | ALARM | silence....................... |

The entire interval is contained inside the audio stream.

There is NO setInterval() responsible for generating
the actual alarm.

============================================================
*/


function createIntervalWav(intervalSeconds) {


    /*
        Number of samples in one complete interval.
    */

    const totalSamples =
        Math.floor(
            SAMPLE_RATE * intervalSeconds
        );


    /*
        Mono, 16-bit PCM.

        2 bytes per sample.
    */

    const dataBytes =
        totalSamples * 2;


    /*
        44-byte standard WAV header.
    */

    const buffer =
        new ArrayBuffer(
            44 + dataBytes
        );


    const view =
        new DataView(buffer);


    /*
        ----------------------------------------------------
        WAV HEADER
        ----------------------------------------------------
    */


    writeString(
        view,
        0,
        "RIFF"
    );


    write32(
        view,
        4,
        36 + dataBytes
    );


    writeString(
        view,
        8,
        "WAVE"
    );


    writeString(
        view,
        12,
        "fmt "
    );


    write32(
        view,
        16,
        16
    );


    /*
        PCM format
    */

    write16(
        view,
        20,
        1
    );


    /*
        Mono
    */

    write16(
        view,
        22,
        1
    );


    /*
        Sample rate
    */

    write32(
        view,
        24,
        SAMPLE_RATE
    );


    /*
        Byte rate:
        sample rate × channels × bytes/sample
    */

    write32(
        view,
        28,
        SAMPLE_RATE * 2
    );


    /*
        Block alignment
    */

    write16(
        view,
        32,
        2
    );


    /*
        16-bit audio
    */

    write16(
        view,
        34,
        16
    );


    writeString(
        view,
        36,
        "data"
    );


    write32(
        view,
        40,
        dataBytes
    );


    /*
        ----------------------------------------------------
        AUDIO
        ----------------------------------------------------
    */


    const alarmSamples =
        Math.floor(
            SAMPLE_RATE * ALARM_DURATION
        );


    for (
        let i = 0;
        i < totalSamples;
        i++
    ) {


        let sample = 0;


        /*
            Only generate the alarm during the beginning
            of each interval.
        */

        if (i < alarmSamples) {


            const t =
                i / SAMPLE_RATE;


            const progress =
                i / alarmSamples;


            /*
                Aggressive frequency sweep.

                Starts around 3000 Hz and drops to ~2100 Hz.
            */

            const frequency =
                3000 -
                900 * progress;


            /*
                Fundamental.
            */

            const fundamental =
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    t
                );


            /*
                Strong second harmonic.
            */

            const harmonic2 =
                0.65 *
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    2 *
                    t
                );


            /*
                Third harmonic.
            */

            const harmonic3 =
                0.30 *
                Math.sin(
                    2 *
                    Math.PI *
                    frequency *
                    3 *
                    t
                );


            /*
                Extremely fast attack.

                This makes the alarm "snap" on.
            */

            let envelope;


            if (progress < 0.015) {

                envelope =
                    progress / 0.015;

            }

            else if (progress > 0.72) {

                envelope =
                    (1 - progress) / 0.28;

            }

            else {

                envelope = 1;

            }


            /*
                Combine harmonics.
            */

            sample =
                (
                    fundamental +
                    harmonic2 +
                    harmonic3
                )
                *
                0.72
                *
                envelope;


            /*
                Absolute safety against digital clipping.
            */

            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

        }


        /*
            Write signed 16-bit PCM.

            All samples outside the alarm are simply zero,
            producing silence.
        */

        view.setInt16(
            44 + i * 2,
            sample * 32767,
            true
        );

    }


    /*
    ========================================================
    CONVERT WAV TO BASE64
    ========================================================
    */


    const bytes =
        new Uint8Array(buffer);


    let binary = "";


    /*
        Process in chunks so String.fromCharCode()
        doesn't exceed argument limits.
    */

    const CHUNK_SIZE = 0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += CHUNK_SIZE
    ) {

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i + CHUNK_SIZE,
                        bytes.length
                    )
                )
            );

    }


    const base64 =
        btoa(binary);


    return (
        "data:audio/wav;base64," +
        base64
    );

}


/*
============================================================
START
============================================================
*/


async function startAlarm() {


    if (running) {
        return;
    }


    /*
        Read user input.
    */

    const seconds =
        Number(
            intervalInput.value
        );


    /*
        Validate.
    */

    if (
        !Number.isFinite(seconds) ||
        seconds < MIN_INTERVAL ||
        seconds > MAX_INTERVAL
    ) {

        status.textContent =
            "Enter an interval from " +
            MIN_INTERVAL +
            " to " +
            MAX_INTERVAL +
            " seconds.";

        return;

    }


    intervalSeconds = seconds;


    /*
    ========================================================
    THIS IS THE IMPORTANT PART
    ========================================================

    Build ONE audio track containing the alarm followed
    by silence for the requested interval.

    Safari's native audio engine then handles playback.
    ========================================================
    */


    status.textContent =
        "Creating audio track...\n" +
        "Please wait.";


    /*
        Generate the WAV.
    */

    const wavUrl =
        createIntervalWav(
            intervalSeconds
        );


    /*
        Give it to the native audio element.
    */

    audio.src = wavUrl;

    audio.loop = true;

    audio.volume = 1.0;


    /*
    ========================================================
    CRITICAL IOS USER-GESTURE STEP
    ========================================================

    This function was triggered directly by the user's
    START button.

    Therefore this play() occurs inside the user gesture,
    which is what Safari wants before allowing audio.
    ========================================================
    */


    try {

        await audio.play();

    }

    catch (error) {

        status.textContent =
            "Safari blocked audio playback.\n\n" +
            "Tap START again and make sure your " +
            "iPhone is not in a state where media playback " +
            "is blocked.\n\n" +
            error;

        return;

    }


    /*
        Audio is now playing.
    */

    running = true;

    startTime =
        performance.now();


    status.textContent =
        "RUNNING\n\n" +
        "Native audio playback active\n" +
        "Alarm every " +
        intervalSeconds +
        " seconds";


    /*
        Disable changing the interval while running.
    */

    intervalInput.disabled = true;


    /*
    ========================================================
    VISUAL COUNTDOWN ONLY
    ========================================================

    This timer is NOT responsible for the alarm.

    If iOS suspends this timer while the phone is locked,
    the actual audio track continues to be handled by the
    audio engine independently.

    ========================================================
    */

    countdownTimer =
        setInterval(
            updateCountdown,
            100
        );

}


/*
============================================================
COUNTDOWN DISPLAY
============================================================
*/


function updateCountdown() {


    if (!running) {
        return;
    }


    const elapsed =
        (
            performance.now() -
            startTime
        ) / 1000;


    /*
        Determine where we are within the repeating
        interval.
    */

    const position =
        elapsed %
        intervalSeconds;


    let remaining =
        intervalSeconds -
        position;


    /*
        Avoid displaying the full interval immediately
        after the alarm.
    */

    if (
        remaining >
        intervalSeconds - 0.01
    ) {

        remaining = 0;

    }


    countdown.textContent =
        remaining.toFixed(1) +
        " s";

}


/*
============================================================
STOP
============================================================
*/


function stopAlarm() {


    running = false;


    /*
        Stop visual timer.
    */

    if (countdownTimer !== null) {

        clearInterval(
            countdownTimer
        );

        countdownTimer = null;

    }


    /*
        Stop native media playback.
    */

    audio.pause();

    audio.currentTime = 0;


    /*
        Release the generated WAV URL.

        The audio element will no longer need it.
    */

    if (
        audio.src &&
        audio.src.startsWith("blob:")
    ) {

        URL.revokeObjectURL(
            audio.src
        );

    }


    intervalInput.disabled = false;


    countdown.textContent =
        "--";


    status.textContent =
        "Stopped";

}


/*
============================================================
BUTTON EVENTS
============================================================
*/


startButton.addEventListener(
    "click",
    startAlarm
);


stopButton.addEventListener(
    "click",
    stopAlarm
);


/*
============================================================
SAFETY / VISIBILITY INFORMATION
============================================================

If Safari tells us that the audio element was paused,
show that on screen.

============================================================
*/


audio.addEventListener(
    "pause",
    () => {

        if (running) {

            status.textContent =
                "WARNING: iPhone/Safari paused " +
                "the audio playback.";

        }

    }
);


audio.addEventListener(
    "playing",
    () => {

        if (running) {

            status.textContent =
                "RUNNING\n\n" +
                "Native audio playback active\n" +
                "Alarm every " +
                intervalSeconds +
                " seconds";

        }

    }
);


</script>

</body>
</html>
